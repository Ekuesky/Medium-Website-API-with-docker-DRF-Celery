upstream api {
  server django-api:8000;
}

server {

  client_max_body_size 20M;

  listen 80;

  location /api/v1/ {

    proxy_pass http://api;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;

  }

  #configuration pour les métriques de Nginx
  location /nginx_status {
    allow 127.0.0.1;
    allow 172.16.0.0/12; # Docker bridge network
    deny all;
    proxy_pass http://api/metrics;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
  }

  location /hidden/ {
    proxy_pass http://api;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;
    proxy_redirect off;
  }

  location /redoc/ {

    proxy_pass http://api;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;
    proxy_redirect off;

  }

  location /staticfiles/ {
    autoindex on;
    alias /app/staticfiles/;
  }

  location /mediafiles/ {
    alias /app/mediafiles/;
  }

  location / {
    return 404; }

}